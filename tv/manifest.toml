schema-version = 1

[package]
title = "CrewOps Board (Meta)"
version = "0.1.0"
# Floor so local builds pass vpt validate; pass an increasing --build-number for every Appstore upload.
build-number = 1
id = "com.crewops.meta.board"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"


[wants]
[[wants.module]]
id = "/com.amazon.kepler.net.net_manager@INetManager"

[components]
[[components.interactive]]
id = "com.crewops.meta.board.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
