[project]
name = "crewops"
version = "0.1.0"
description = "Crew control for regional airlines: a multimodal agent on Meta's Muse models that keeps every roster change legal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mangum>=0.19",
  "mcp>=1.2",
  "pillow>=11",
  "pydantic>=2.9",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "moto[dynamodb]>=5.0",
  "pytest>=8.0",
  "ruff>=0.6",
]
infra = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with these markers as defaults; they are not mutable.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form"]
