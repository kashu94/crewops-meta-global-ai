[project]
name = "crewops"
version = "0.1.0"
description = "Crew control for regional airlines: a multimodal agent on Meta's Muse models that keeps every roster change legal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "httpx>=0.27",
  "mcp>=1.2",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "moto[dynamodb]>=5.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
